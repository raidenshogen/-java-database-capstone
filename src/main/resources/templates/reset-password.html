<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Set password')}"></head>
<body>
<svg th:replace="~{fragments :: icons}"></svg>
<main class="auth">
  <aside th:replace="~{fragments :: authHero}"></aside>
  <section class="auth-panel">
    <div class="auth-card">
      <div class="eyebrow">Almost there</div>
      <h1>Set a new password</h1>
      <p class="lede">Choose a strong password you haven't used before.</p>
      <form id="reset-form" class="stack">
        <label>Reset token<span class="field-icon"><svg class="i"><use href="#i-key"/></svg><input id="token" th:value="${token}" required></span></label>
        <label>New password
          <span class="field-icon has-toggle"><svg class="i"><use href="#i-lock"/></svg><input id="password" type="password" minlength="8" autocomplete="new-password" data-strength required>
            <button type="button" class="toggle-pw" data-toggle-password aria-label="Show or hide password"><svg class="i"><use href="#i-eye"/></svg></button></span></label>
        <button class="btn btn-primary btn-block" type="submit">Set password</button>
        <div id="message" class="hidden"></div>
      </form>
      <div class="auth-links"><a href="/login">← Back to sign in</a></div>
    </div>
  </section>
</main>
<script src="/clinic.js"></script>
<script>
qs("#reset-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = qs("[type=submit]", e.target); setBusy(btn, true);
  try {
    const r = await api("/api/auth/reset-password", { method: "POST", body: JSON.stringify({ token: qs("#token").value, newPassword: qs("#password").value }) });
    showMessage(qs("#message"), r.message); toast(r.message || "Password updated."); setTimeout(() => location.href = "/login", 1100);
  } catch (x) { showMessage(qs("#message"), x.message, "error"); setBusy(btn, false); }
});
</script>
</body>
</html>
