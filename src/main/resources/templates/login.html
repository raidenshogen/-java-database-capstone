<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>SmartClinic — Login</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { margin: 0 0 1.5rem; color: #1f2937; font-size: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #374151; font-size: 0.9rem; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #1d4ed8; }
        .error { color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem; padding: 0.5rem; background: #fee2e2; border-radius: 4px; }
        .success { color: #166534; font-size: 0.875rem; margin-bottom: 1rem; padding: 0.5rem; background: #dcfce7; border-radius: 4px; }
        .hint { font-size: 0.8rem; color: #6b7280; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h1>SmartClinic Login</h1>

    <div th:if="${error}" class="error">[[${error}]]</div>
    <div th:if="${message}" class="success">[[${message}]]</div>

    <form action="/perform-login" method="post">
        <div class="form-group">
            <label for="username">Username / Email</label>
            <input type="text" id="username" name="username" required autofocus/>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required/>
        </div>
        <button type="submit">Sign in</button>
    </form>

    <p class="hint">
        Default admin: admin / admin123<br/>
        Doctors and patients are created by Admin.
    </p>
</div>
</body>
</html>
