<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<svg th:replace="~{fragments :: icons}"></svg>
<main class="auth">
  <aside th:replace="~{fragments :: authHero}"></aside>
  <section class="auth-panel">
    <div class="auth-card">
      <div class="eyebrow">Welcome back</div>
      <h1>Sign in to SmartClinic</h1>
      <p class="lede">Enter your credentials to access your workspace.</p>

      <div th:if="${error}" class="notice notice-error" style="margin-bottom:1rem"><svg class="i"><use href="#i-alert"/></svg><span th:text="${error}"></span></div>
      <div th:if="${message}" class="notice notice-success" style="margin-bottom:1rem"><svg class="i"><use href="#i-check"/></svg><span th:text="${message}"></span></div>

      <form action="/perform-login" method="post" class="stack" id="login-form">
        <label>Username / Email
          <span class="field-icon"><svg class="i"><use href="#i-mail"/></svg><input type="text" id="username" name="username" autocomplete="username" required autofocus></span></label>
        <label>Password
          <span class="field-icon has-toggle"><svg class="i"><use href="#i-lock"/></svg><input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" data-toggle-password aria-label="Show or hide password"><svg class="i"><use href="#i-eye"/></svg></button></span></label>
        <button type="submit" class="btn btn-primary btn-block">Sign in<svg class="i"><use href="#i-arrow-left" style="transform:scaleX(-1)"/></svg></button>
      </form>

      <div class="auth-links"><a href="/signup">Create a patient account</a><span>·</span><a href="/forgot-password">Forgot password?</a></div>
    </div>
  </section>
</main>
<script src="/clinic.js"></script>
<script>
qs("#login-form").addEventListener("submit", e => qs("[type=submit]", e.target).classList.add("is-busy"));
</script>
</body>
</html>
