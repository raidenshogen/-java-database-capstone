<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forgot password')}"></head>
<body>
<svg th:replace="~{fragments :: icons}"></svg>
<main class="auth">
  <aside th:replace="~{fragments :: authHero}"></aside>
  <section class="auth-panel">
    <div class="auth-card">
      <div class="eyebrow">Account recovery</div>
      <h1>Reset your password</h1>
      <p class="lede">Enter your patient email and we will send a reset link.</p>
      <form id="forgot-form" class="stack">
        <label>Email<span class="field-icon"><svg class="i"><use href="#i-mail"/></svg><input id="email" type="email" autocomplete="email" required autofocus></span></label>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
        <div id="message" class="hidden"></div>
      </form>
      <div class="auth-links"><a href="/login">← Back to sign in</a></div>
    </div>
  </section>
</main>
<script src="/clinic.js"></script>
<script>
qs("#forgot-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = qs("[type=submit]", e.target); setBusy(btn, true);
  try {
    const r = await api("/api/auth/forgot-password", { method: "POST", body: JSON.stringify({ email: qs("#email").value }) });
    showMessage(qs("#message"), r.message);
  } catch (x) { showMessage(qs("#message"), x.message, "error"); }
  setBusy(btn, false);
});
</script>
</body>
</html>
