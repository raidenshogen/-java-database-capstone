spring.application.name=SmartClinic

# Local .env is optional; production should provide environment variables directly.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/smartclinic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=smartclinic
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartclinic}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartclinic}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Admin seed account
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}

# SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
