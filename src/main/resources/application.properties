spring.application.name=SmartClinic

# =====================================================================
# Database: MySQL (Spring Data JPA) — Admin, Doctor, Patient, Appointment, Specialty
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/smartclinic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:smartclinic}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================================
# Database: MongoDB (Spring Data MongoDB) — Prescriptions
# =====================================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartclinic}

# =====================================================================
# Spring Security
# =====================================================================
# Admin seed account (only one, created at startup via DataLoader)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# =====================================================================
# SMTP (email notifications — Doctor cancels appointment, password resets)
# =====================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================================
# Server
# =====================================================================
server.port=${SERVER_PORT:8080}

# =====================================================================
# JWT (JSON Web Token) — used for stateless API authentication
# =====================================================================
jwt.secret=${JWT_SECRET:default-secret-key-change-in-production-min-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
